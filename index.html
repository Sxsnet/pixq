<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X HOT</title>
<style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; margin:0; padding:20px; }
    h1 { color:#fff; font-size:40px; margin:20px 0; font-weight: 900; letter-spacing: 3px; }
    
    .video-container { max-width: 380px; margin: auto; position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; }
    .video-container img { width: 100%; display: block; }

    .play-btn {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 65px; height: 65px; background: rgba(0, 0, 0, 0.6);
        border-radius: 50%; border: 2px solid #fff; display: flex; 
        align-items: center; justify-content: center; pointer-events: none;
    }
    .play-btn::after {
        content: ''; border-left: 20px solid #fff;
        border-top: 12px solid transparent; border-bottom: 12px solid transparent;
        margin-left: 5px;
    }

    .btn-premium { 
        display: flex; align-items: center; justify-content: center; width: 95%; max-width: 350px; 
        margin: 20px auto; padding: 18px; background: #fff; border-radius: 50px; 
        text-decoration: none; color: #000; font-weight: bold; font-size: 18px; 
    }
    
    .gallery { display:flex; justify-content:center; gap:10px; margin-top:20px; }
    .gallery-item { position:relative; width:48%; height:100px; overflow:hidden; border-radius:12px; cursor:pointer; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>

<h1>X HOT</h1>

<div class="video-container" onclick="goAd()">
    <div class="play-btn"></div>
    <img src="thumbnail_anda.jpg" alt="Video">
</div>

<a class="btn-premium" href="https://depthschokedirected.com/bsq5yxh8u?key=37884cb0b420e2fdfe6dd3331580e9c2">
    ACCESS FULL
</a>

<div class="gallery">
    <div class="gallery-item" onclick="goGallery()"><img src="foto3.jpg"></div>
    <div class="gallery-item" onclick="goGallery()"><img src="foto4.jpg"></div>
</div>

<script>
    function goAd(){ window.location.href = "https://depthschokedirected.com/bsq5yxh8u?key=37884cb0b420e2fdfe6dd3331580e9c2"; }
    function goGallery(){ window.location.href = "https://depthschokedirected.com/wyzvf47d?key=0473ec9e38168594eb580a18919cd1fc"; }
</script>

</body>
</html>
