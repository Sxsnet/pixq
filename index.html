<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Hot</title>

<style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; margin:0; padding:20px; }
    h1 { color:#fff; font-size:24px; margin:15px 0; font-weight: bold; letter-spacing: 2px; }
    
    .video-container { max-width: 380px; margin: auto; position: relative; cursor: pointer; }
    video { width: 100%; border-radius: 10px; display: block; pointer-events: none; background: #000; }

    .play-btn-base {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: white; border-radius: 50%;
        pointer-events: none;
    }
    
    .play-button { width: 80px; height: 80px; }
    .play-button:after {
        content: ''; position: absolute; left: 32px; top: 24px;
        border-style: solid; border-width: 16px 0 16px 28px;
        border-color: transparent transparent transparent black;
    }

    .play-icon { width: 30px; height: 30px; }
    .play-icon:after {
        content: ''; position: absolute; left: 12px; top: 8px;
        border-style: solid; border-width: 7px 0 7px 12px;
        border-color: transparent transparent transparent black;
    }

    /* Tombol Premium: Latar Putih, Teks Hitam, Lonjong */
    .btn-premium { 
        display: flex; align-items: center; justify-content: center; width: 95%; max-width: 350px; 
        margin: 20px auto; padding: 15px; background: #fff !important; 
        border: none; border-radius: 50px !important; text-decoration: none; 
        color: #000 !important; font-weight: bold; font-size: 16px; 
    }
    
    .gallery { display:flex; justify-content:center; gap:10px; margin-top:20px; }
    .gallery-item { position:relative; width:48%; height:100px; overflow:hidden; border-radius:10px; cursor:pointer; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>
