<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Online</title>

<style>
body{ background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; margin:0; padding:20px; }
h1{ color:#ff3b3b; font-size:40px; margin:10px 0; }
.subtitle{ color:#d0d0d0; font-size:18px; margin-bottom:20px; }
.video-box{ max-width:380px; margin:auto; position:relative; }
video{ width:100%; border-radius:18px; display:block; }

.fake-duration {
    position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.6);
    color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none;
}

.btn-premium {
    display: flex; align-items: center; justify-content: center; width: 95%; max-width: 350px;
    margin: 15px auto; padding: 18px; background: linear-gradient(135deg, #1f1f1f 0%, #0a0a0a 100%);
    border: 1px solid #d4af37; border-radius: 12px; text-decoration: none;
    color: #d4af37; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
}
.icon-svg { width: 25px; height: 25px; margin-right: 10px; fill: #d4af37; }

.gallery{ display:flex; justify-content:center; gap:10px; margin-top:20px; }
.gallery-item{ position:relative; width:48%; height:100px; overflow:hidden; border-radius:12px; cursor:pointer; }
.gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; }
.play-icon{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.6); width:40px; height:40px; line-height:40px; border-radius:50%; font-size:20px; color:white; }
.info{ margin-top:20px; font-size:18px; line-height:2; color:#ddd; }
</style>
</head>
<body>

<h1>WATCH ONLINE</h1>
<div class="subtitle">High Quality Preview Available</div>

<div class="video-box">
    <video id="vid" controls playsinline>
        <source src="VID_20260530_014503_814.mp4" type="video/mp4">
    </video>
    <div class="fake-duration">1:05:22</div>
</div>

<!-- SMARTLINK 1: TOMBOL UTAMA -->

    <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5v14l11-7z"/>
    </svg>
    CONTINUE WATCHING
</a>

<!-- SMARTLINK 2: GALERI -->

<div class="gallery-item" onclick="goGallery()"><img src="foto4.jpg"><div class="play-icon">▶</div></div>

</html>
