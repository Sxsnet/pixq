<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Hot</title>

<style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; margin:0; padding:20px; }
    h1 { color:#fff; font-size:40px; margin:20px 0; font-weight: 900; letter-spacing: 3px; }
    
    .video-container { max-width: 380px; margin: auto; position: relative; cursor: pointer; }
    
    /* Video tidak bisa disentuh dan tidak jalan otomatis sesuai keinginanmu */
    video { 
        width: 100%; 
        border-radius: 10px; 
        display: block; 
        pointer-events: none; 
        background: #000; 
    }

    .play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: rgba(0,0,0,0.6);
        border-radius: 50%;
        pointer-events: none;
    }

    .play-button:after {
        content: '';
        position: absolute;
        left: 28px;
        top: 20px;
        border-style: solid;
        border-width: 15px 0 15px 25px;
        border-color: transparent transparent transparent white;
    }

    .btn-premium { 
        display: flex; align-items: center; justify-content: center; width: 95%; max-width: 350px; 
        margin: 20px auto; padding: 18px; background: #fff; 
        border-radius: 50px; text-decoration: none; 
        color: #000; font-weight: bold; font-size: 18px; 
    }
    
    .gallery { display:flex; justify-content:center; gap:10px; margin-top:20px; }
    .gallery-item { position:relative; width:48%; height:100px; overflow:hidden; border-radius:12px; cursor:pointer; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .play-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.6); width:40px; height:40px; line-height:40px; border-radius:50%; font-size:20px; color:white; pointer-events: none; }
</style>
</head>
<body>

<h1>X HOT</h1>

<div class="video-container" onclick="goAd()">
    <video playsinline>
        <source src="rus.mp4" type="video/mp4">
    </video>
    <div class="play-button"></div>
</div>

<a class="btn-premium" href="https://depthschokedirected.com/bsq5yxh8u?key=37884cb0b420e2fdfe6dd3331580e9c2">
    WATCH NOW
</a>

<div class="gallery">
    <div class="gallery-item" onclick="goGallery()"><img src="foto3.jpg"><div class="play-icon">▶</div></div>
    <div class="gallery-item" onclick="goGallery()"><img src="foto4.jpg"><div class="play-icon">▶</div></div>
</div>

<script>
    function goAd(){ window.location.href = "https://depthschokedirected.com/bsq5yxh8u?key=37884cb0b420e2fdfe6dd3331580e9c2"; }
    function goGallery(){ window.location.href = "https://depthschokedirected.com/wyzvf47d?key=0473ec9e38168594eb580a18919cd1fc"; }
</script>

</body>
</html>
